version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: credit-risk-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: credit-risk-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000/predict
    depends_on:
      - backend